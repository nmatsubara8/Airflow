[project]
name = "airflow-mcp"
version = "0.1.0"
description = "Airflow AI Taskboard — MCP server stubs (Phase 2 MVP)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "ulid-py>=1.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
airflow-mcp        = "airflow_mcp.__main__:main"
airflow-mvp        = "airflow_mcp.mvp:run_all"
airflow-ingester   = "airflow_mcp.ingester.main:_cli"
airflow-dispatcher = "airflow_mcp.dispatcher.main:_cli"
airflow-runner     = "airflow_mcp.runner.main:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests — require running services or heavy fixtures (deselect with -m 'not integration')",
    "slow: slow unit tests that start real HTTP servers (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
