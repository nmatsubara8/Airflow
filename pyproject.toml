[project]
name = "airflow-mcp"
version = "0.1.0"
description = "Airflow AI Taskboard — MCP server stubs (Phase 2 MVP)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "ulid-py>=1.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
airflow-mcp = "airflow_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
