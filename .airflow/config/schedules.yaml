# Scheduled Task Configuration (DDD-08 §7.1)
# All times are JST (Asia/Tokyo). Executed by airflow-scheduler.service.

timezone: Asia/Tokyo

schedules:
  # Engineering team — nightly batch
  nightly_engineering_review:
    cron: "0 2 * * *"              # 02:00 every day
    task_template: engineering_review_batch
    category: engineering
    priority: 3
    agents:
      - agent_code_reviewer
      - agent_test_engineer
    description: "夜間エンジニアリングレビューバッチ"

  # Content team — morning QA
  morning_content_qa:
    cron: "0 7 * * *"              # 07:00 every day
    task_template: content_qa_batch
    category: content
    priority: 3
    agents:
      - agent_content_editor
      - agent_fact_checker
    description: "朝のコンテンツ品質チェック"

  # Business team briefing — Tue/Fri
  business_briefing:
    cron: "0 9 * * 2,5"           # 09:00 Tue & Fri
    task_template: business_briefing
    category: business
    priority: 4
    agents:
      - agent_business_strategy
    description: "ビジネス定期ブリーフィング（火・金）"

  # Engineering director weekly — Mon
  eng_director_briefing:
    cron: "0 9 * * 1"             # 09:00 every Monday
    task_template: eng_director_briefing
    category: engineering
    priority: 4
    agents:
      - agent_eng_director
    description: "エンジニアリングディレクター週次ブリーフィング（月）"
    executor: airflow-scheduler.service  # エージェント不要、直接実行

  # Cleaner — weekly
  weekly_cleanup:
    cron: "0 3 * * 0"             # 03:00 every Sunday
    task_template: weekly_cleanup
    category: orchestration
    priority: 7
    agents:
      - agent_cleaner
    description: "週次クリーンアップ（古いタスク・ログのアーカイブ）"
