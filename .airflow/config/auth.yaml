# Authentication & Authorization Configuration (DDD-08 §4)
# Phase 2 MVP: API key mode. JWT upgrade planned for Phase 5.

auth:
  mode: api_key                      # api_key | jwt (Phase 5)
  token_header: "X-Airflow-Token"

  # API keys are stored in environment variables, not this file.
  # Token format: airflow_<env>_<24 byte random> (DDD-02 §2.2)
  # Expected env vars:
  #   AIRFLOW_MCP_TOKEN_ADMIN
  #   AIRFLOW_MCP_TOKEN_AGENT
  #   AIRFLOW_MCP_TOKEN_READONLY
  key_env_prefix: "AIRFLOW_MCP_TOKEN_"

  roles:
    admin:
      description: "Full access including config changes"
      scopes: ["tasks:*", "agents:*", "models:*", "gpu:*", "notes:*", "config:*"]

    agent:
      description: "Standard agent execution scope"
      scopes: ["tasks:read", "tasks:write", "notes:read", "notes:search", "models:read", "models:execute", "gpu:read", "gpu:reserve"]

    readonly:
      description: "Read-only monitoring"
      scopes: ["tasks:read", "agents:read", "models:read", "gpu:read"]

rate_limit:
  algorithm: token_bucket
  default:
    capacity: 100                    # max burst
    refill_rate: 10                  # tokens per second
  per_role:
    admin:
      capacity: 500
      refill_rate: 50
    agent:
      capacity: 200
      refill_rate: 20
    readonly:
      capacity: 50
      refill_rate: 5
  # Per-action limits (DDD-08 §4.2) — independent bucket per (token, action) pair
  # Restricts high-cost MCP tool calls separately from the global token bucket.
  per_action_limits:
    tasks_create:    { capacity: 60,  refill_rate: 1.0  }  # 60/min burst
    models_execute:  { capacity: 20,  refill_rate: 0.33 }  # 20/min burst
    notes_search:    { capacity: 100, refill_rate: 1.67 }  # 100/min burst
    notes_reindex:   { capacity: 2,   refill_rate: 0.03 }  # 2/min (high-cost op)

mcp_auth:
  require_token: true
  token_expiry_s: 3600               # 1 hour session token
  # PRODUCTION: set to false (or AIRFLOW_AUTH_LOCALHOST_BYPASS=false env var)
  # WARNING: localhost_bypass=true disables authentication for 127.0.0.1 requests.
  localhost_bypass: false
