services:
  # ── Ollama LLM backend ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # GPU: uncomment if nvidia-container-toolkit is installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── MCP servers ──────────────────────────────────────────────────────────
  taskboard:
    build: .
    command: ["python", "-m", "airflow_mcp", "taskboard"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  models:
    build: .
    command: ["python", "-m", "airflow_mcp", "models"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  gpu:
    build: .
    command: ["python", "-m", "airflow_mcp", "gpu"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  notes:
    build: .
    command: ["python", "-m", "airflow_mcp", "notes"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  agents:
    build: .
    command: ["python", "-m", "airflow_mcp", "agents"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    restart: unless-stopped

  # ── Dispatcher + Runner ──────────────────────────────────────────────────
  dispatcher:
    build: .
    command: ["python", "-m", "airflow_mcp.dispatcher.main"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  runner:
    build: .
    command: ["python", "-m", "airflow_mcp.runner.main"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard ────────────────────────────────────────────────────────────
  dashboard:
    build: .
    command: ["python", "deploy/systemd/airflow-dashboard.sh"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
      - ./deploy/systemd/airflow-dashboard.sh:/app/deploy/systemd/airflow-dashboard.sh:ro
    env_file: .env
    environment:
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    ports:
      - "7400:7400"
    depends_on:
      - dispatcher
    restart: unless-stopped

  # ── Metrics (Prometheus exporter) ────────────────────────────────────────
  metrics:
    build: .
    command: ["python", "deploy/systemd/airflow-metrics.sh"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./deploy/systemd/airflow-metrics.sh:/app/deploy/systemd/airflow-metrics.sh:ro
    env_file: .env
    environment:
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  ollama_data:
  airflow_tasks:
