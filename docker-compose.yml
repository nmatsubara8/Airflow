services:
  # ── Ollama LLM backend ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    # GPU: uncomment if nvidia-container-toolkit is installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Dispatcher (inbox polling loop) ──────────────────────────────────────
  dispatcher:
    build: .
    command: ["python", "-m", "airflow_mcp", "dispatcher"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard (Web UI :7400) ──────────────────────────────────────────────
  dashboard:
    build: .
    command: ["python", "-m", "airflow_mcp", "dashboard"]
    volumes:
      - airflow_tasks:/data/tasks
      - ./.airflow/config:/app/.airflow/config:ro
    env_file: .env
    environment:
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    ports:
      - "127.0.0.1:7400:7400"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Metrics (Prometheus exporter :9090) ──────────────────────────────────
  metrics:
    build: .
    command: ["python", "-m", "airflow_mcp", "metrics"]
    volumes:
      - airflow_tasks:/data/tasks
    env_file: .env
    environment:
      AIRFLOW_TASKBOARD_DIR: /data/tasks
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # NOTE: MCP servers (taskboard, notes, models, gpu, agents) are stdio-based
  # and must be launched by Claude Desktop, not as persistent Docker services.
  # Configure them in Claude Desktop's MCP settings using deploy/mcp-start.sh.

volumes:
  ollama_data:
  airflow_tasks:
